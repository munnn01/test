[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "machine-vision-paper-reproduction"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "torchvision>=0.20,<1", "numpy>=1.24", "Pillow>=10", "scipy>=1.10", "opencv-python-headless>=4.8", "pycocotools>=2.0.7"]
[project.optional-dependencies]
cloud = ["compressai==1.2.8", "kaggle>=2.2"]
dev = ["pytest>=8"]
[tool.setuptools.packages.find]
include = ["reproduce*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
