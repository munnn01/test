[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-ar-od-proxy"
version = "0.1.0"
description = "One real-codec video stream for AR and OD with proxy backpropagation"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "torchvision>=0.20,<1", "numpy>=1.24", "scipy>=1.10", "opencv-python-headless>=4.8", "Pillow>=10", "pycocotools>=2.0.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
launch = ["kaggle>=1.7"]

[project.scripts]
ar-od-proxy = "ar_od_proxy.run:main"

[tool.setuptools.packages.find]
include = ["ar_od_proxy*"]

[tool.setuptools.package-data]
ar_od_proxy = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
